[package]
name = "codex-baoan"
version = "0.4.0"
description = "Codex 保安 · 本机模型审计（对标 CC Switch 的 Tauri 桌面应用）"
authors = ["jliushi"]
edition = "2021"

[lib]
name = "codex_baoan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }

# --- MITM + tokenizer fingerprint: wired in after the Tauri shell builds clean ---
# hudsucker = { version = "0.23", features = ["rustls-client", "full"] }
# rcgen = { version = "0.13", features = ["pem"] }
# rustls = "0.23"
# tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# tiktoken-rs = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
