name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags="-H windowsgui -s -w" -o "Codex-Baoan-${{ github.ref_name }}-Windows.exe" .

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Codex 保安 ${{ github.ref_name }}
          files: Codex-Baoan-${{ github.ref_name }}-Windows.exe
          body: |
            ## Codex 保安 ${{ github.ref_name }}

            模型审计观察器（原生 exe，双击即用）：本机 MITM 抓取 CC Switch 出口的真实请求，分词器指纹识别实际模型家族，CC Switch 风格看板出「总请求 / 异常 / 异常实际是什么模型」。

            - `Codex-Baoan-${{ github.ref_name }}-Windows.exe`

            用法：双击 → 一键信任证书 → 一键接入 CC Switch → 重启一次 CC Switch。
